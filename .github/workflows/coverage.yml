name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COVERAGE_BUILD_DIR: build/coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config python3 gcovr \
            libboost-dev libcurl4-openssl-dev libssl-dev libzstd-dev

      - name: Configure coverage build
        run: |
          cmake -S . -B "${COVERAGE_BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRQP_SECURITY_CORE_BUILD_TESTS=ON \
            -DRQP_SECURITY_CORE_ENABLE_COVERAGE=ON

      - name: Build and test with coverage
        run: make test-coverage

      - name: Publish step summary
        run: |
          {
            echo "## Coverage"
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .github/badges/coverage.json
            coverage-summary.txt

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update coverage badge [skip ci]"
          file_pattern: .github/badges/coverage.json
